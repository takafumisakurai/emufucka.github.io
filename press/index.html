        ["References", "LoudMemories", "国際／国不明", "emufucka - ULTRA JAPAN 2014, Tokyo. 27 Sep 2014", "https://www.loudmemories.com/concerts/emufucka-at-ultra-japan-2014-festival-9519973"],
        ["References", "Sónar", "スペイン", "Sónar 2014", "https://sonar.es/en/about/previous-editions/2014"],
        ["References", "musicfest.pt", "ポルトガル", "Red Bull Music Academy apresenta o SonarDôme no Sónar em Barcelona", "https://musicfest.pt/red-bull-music-academy-apresenta-o-sonardome-sonar-em-barcelona-4565/"],
        ["References", "Lima Gris", "ペルー", "Dengue Dengue Dengue tocará en el Red Bull Music Academy en Barcelona", "https://limagris.com/dengue-dengue-dengue-tocara-en-el-red-bull-music-academy-en-barcelona/"],
        ["References", "Urban Buddha Music", "国不明／英語圏ブログ", "RED BULL MUSIC ACADEMY Sonar FestivalDôme 2014 Playlist", "https://urbanbuddhamusic.wordpress.com/2014/04/10/red-bull-music-academy-sonar-festivaldome-2014-playlist/"],
        ["References", "Summer Festival Guide", "英国", "Sonar Barcelona", "https://www.summerfestivalguide.co.uk/festival-news/sonar-barcelona/"],
        ["References", "Resident Advisor", "英国／国際", "Red Bull Music Academy presents Lost In Karaoke", "https://ra.co/events/766032"],
        ["References", "Music Connection Magazine", "米国", "Red Bull Music Academy Tokyo Applications Now Open", "https://www.musicconnection.com/red-bull-music-academy-tokyo-applications-open/"]
      ];
      const escapeHtml = (value) => String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
      const seen = new Set();
      const uniqueRows = rows.filter((row) => {
        const url = row[4];
        if (!url || seen.has(url)) return false;
        seen.add(url);
        return true;
      });
      const renderRow = ([, media, country, title, url]) =>
        '<li><span class="press-source">' + escapeHtml(media) + ' (' + escapeHtml(country) + ')</span><span class="press-dash">-</span><a href="' +
        escapeHtml(url) + '" target="_blank" rel="noopener">' + escapeHtml(title) + '</a></li>';
      document.getElementById("press-ledger").innerHTML = groups.map(([key, label]) => {
        const items = uniqueRows.filter((row) => row[0] === key);
        return '<section class="press-ledger-section"><header class="press-ledger-heading"><h3>' + escapeHtml(label) +
          '</h3><span>' + items.length + '</span></header><ol class="press-ledger">' + items.map(renderRow).join('') + '</ol></section>';
      }).join('');
      document.querySelectorAll("#press-summary dd").forEach((node, index) => {
        node.textContent = uniqueRows.filter((row) => row[0] === groups[index][0]).length;
      });
    })();
  </script>
</body>
